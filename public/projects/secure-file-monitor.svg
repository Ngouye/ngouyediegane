<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2557"/><stop offset="1" stop-color="#1f4bb0"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.5"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.45"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#fff" fill-opacity="0.08"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06122e" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Panneau : fichiers surveillés -->
  <g filter="url(#sh)"><rect x="110" y="140" width="580" height="440" rx="24" fill="#fff"/></g>
  <text x="150" y="200" font-size="26" font-weight="700" fill="#0f2557">Surveillance d’intégrité</text>

  <path d="M150 238h34l12 12v42h-46z" fill="#eaf0fc" stroke="#2256c9" stroke-width="2.5"/>
  <rect x="216" y="246" width="230" height="12" rx="6" fill="#cdd7e8"/><rect x="216" y="270" width="170" height="10" rx="5" fill="#e3e9f3"/>
  <rect x="530" y="244" width="120" height="36" rx="18" fill="#e3f6ec"/><text x="590" y="268" font-size="17" font-weight="700" fill="#15935f" text-anchor="middle">Intact</text>
  <line x1="150" y1="320" x2="650" y2="320" stroke="#e3e9f3" stroke-width="2"/>

  <path d="M150 346h34l12 12v42h-46z" fill="#eaf0fc" stroke="#2256c9" stroke-width="2.5"/>
  <rect x="216" y="354" width="200" height="12" rx="6" fill="#cdd7e8"/><rect x="216" y="378" width="150" height="10" rx="5" fill="#e3e9f3"/>
  <rect x="530" y="352" width="120" height="36" rx="18" fill="#e3f6ec"/><text x="590" y="376" font-size="17" font-weight="700" fill="#15935f" text-anchor="middle">Intact</text>
  <line x1="150" y1="428" x2="650" y2="428" stroke="#e3e9f3" stroke-width="2"/>

  <path d="M150 454h34l12 12v42h-46z" fill="#fdeaea" stroke="#c62828" stroke-width="2.5"/>
  <rect x="216" y="462" width="240" height="12" rx="6" fill="#cdd7e8"/><rect x="216" y="486" width="180" height="10" rx="5" fill="#e3e9f3"/>
  <rect x="530" y="460" width="120" height="36" rx="18" fill="#fdeaea"/><text x="590" y="484" font-size="17" font-weight="700" fill="#c62828" text-anchor="middle">Modifié</text>

  <!-- Bouclier + empreinte SHA-256 -->
