  <rect x="760" y="548" width="340" height="50" rx="12" fill="#fff" fill-opacity="0.1" stroke="#8fb0ff" stroke-opacity="0.5"/>
  <text x="930" y="580" font-size="19" font-family="Consolas, monospace" fill="#cfe0ff" text-anchor="middle">SHA-256 · 9f86d081…b0f00a08</text>
  <rect x="1078" y="214" width="120" height="44" rx="22" fill="#2256c9"/><text x="1138" y="243" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">AES</text>
