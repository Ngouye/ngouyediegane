<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2557"/><stop offset="1" stop-color="#1f4bb0"/></linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.4" r="0.5"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.4"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#fff" fill-opacity="0.08"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06122e" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#dots)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Boîte de réception classée -->
  <g filter="url(#sh)"><rect x="110" y="120" width="640" height="480" rx="22" fill="#fff"/></g>
  <text x="150" y="182" font-size="26" font-weight="700" fill="#0f2557">Boîte de réception</text>
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <g stroke="#c62828">
      <rect x="150" y="222" width="46" height="34" rx="5"/><path d="M150 226l23 16 23-16"/>
      <rect x="150" y="392" width="46" height="34" rx="5"/><path d="M150 396l23 16 23-16"/>
    </g>
    <g stroke="#2256c9">
      <rect x="150" y="307" width="46" height="34" rx="5"/><path d="M150 311l23 16 23-16"/>
      <rect x="150" y="477" width="46" height="34" rx="5"/><path d="M150 481l23 16 23-16"/>
    </g>
  </g>
  <g fill="#cdd7e8"><rect x="220" y="224" width="220" height="12" rx="6"/><rect x="220" y="309" width="190" height="12" rx="6"/><rect x="220" y="394" width="240" height="12" rx="6"/><rect x="220" y="479" width="170" height="12" rx="6"/></g>
  <g fill="#e3e9f3"><rect x="220" y="246" width="300" height="9" rx="4"/><rect x="220" y="331" width="260" height="9" rx="4"/><rect x="220" y="416" width="280" height="9" rx="4"/><rect x="220" y="501" width="250" height="9" rx="4"/></g>
  <g stroke="#e3e9f3" stroke-width="2"><line x1="150" y1="282" x2="710" y2="282"/><line x1="150" y1="367" x2="710" y2="367"/><line x1="150" y1="452" x2="710" y2="452"/></g>
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="580" y="224" width="130" height="32" rx="16" fill="#fdeaea"/><text x="645" y="245" fill="#c62828">SPAM</text>
    <rect x="580" y="309" width="130" height="32" rx="16" fill="#e3f6ec"/><text x="645" y="330" fill="#15935f">LÉGITIME</text>
    <rect x="580" y="394" width="130" height="32" rx="16" fill="#fdeaea"/><text x="645" y="415" fill="#c62828">SPAM</text>
    <rect x="580" y="479" width="130" height="32" rx="16" fill="#e3f6ec"/><text x="645" y="500" fill="#15935f">LÉGITIME</text>
  </g>

  <!-- Modèle bayésien : poids des mots -->
  <text x="830" y="250" font-size="50" font-family="Georgia, 'Times New Roman', serif" fill="#fff">P(spam | mots)</text>
  <text x="832" y="292" font-size="22" fill="#b4c2df">Naive Bayes multinomial</text>
  <g font-size="18" fill="#cfe0ff">
    <text x="832" y="364">gratuit</text><rect x="940" y="348" width="230" height="22" rx="11" fill="#f87171"/>
    <text x="832" y="414">gagnez</text><rect x="940" y="398" width="190" height="22" rx="11" fill="#f87171"/>
    <text x="832" y="464">réunion</text><rect x="940" y="448" width="70" height="22" rx="11" fill="#8fb0ff"/>
    <text x="832" y="514">facture</text><rect x="940" y="498" width="90" height="22" rx="11" fill="#8fb0ff"/>
  </g>
</svg>
