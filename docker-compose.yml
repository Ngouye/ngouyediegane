services:
  postgres:
    image: postgres:16-alpine
    container_name: platmoi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platmoi
      POSTGRES_USER: platmoi
      POSTGRES_PASSWORD: platmoi
    ports:
      - "5433:5432"
    volumes:
      - platmoi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platmoi -d platmoi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  platmoi_pgdata:
