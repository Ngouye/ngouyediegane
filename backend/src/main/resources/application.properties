spring.application.name=platmoi-portfolio

server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/platmoi}
spring.datasource.username=${DB_USERNAME:platmoi}
spring.datasource.password=${DB_PASSWORD:platmoi}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
spring.datasource.hikari.auto-commit=true

# Mettre à true pour recharger les données (profil, skills, projets...)
platmoi.seed.refresh=true

# Orignes autorisées pour CORS (séparées par des virgules)
app.allowed-origins=http://localhost:5173,http://localhost:3000
