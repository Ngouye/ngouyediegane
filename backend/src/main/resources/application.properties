spring.application.name=platmoi-portfolio

server.port=${PORT:8080}

# --- CONFIGURATION POSTGRESQL ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURATION JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
spring.datasource.hikari.auto-commit=true

# --- CONFIGURATION DE L'APPLICATION ---
# Mettre a true pour recharger les donnees (profil, skills, projets...)
platmoi.seed.refresh=true

# Origines autorisees pour CORS (separees par des virgules)
app.allowed-origins=http://localhost:5173,http://localhost:3000