spring.application.name=platmoi-portfolio

server.port=${PORT:8080}

# --- CONFIGURATION POSTGRESQL ---
# Valeurs par défaut = Docker local (docker compose up -d)
# En prod (Render), définir DB_URL, DB_USERNAME, DB_PASSWORD en variables d'environnement
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/platmoi}
spring.datasource.username=${DB_USERNAME:platmoi}
spring.datasource.password=${DB_PASSWORD:platmoi}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURATION JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
spring.datasource.hikari.auto-commit=true

# --- CONFIGURATION DE L'APPLICATION ---
platmoi.seed.refresh=true
app.allowed-origins=http://localhost:5173,http://localhost:3000